[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luar"
version = "0.8.1"
description = "LUAR (Local Utility for Automated Reviews): catalog spreadsheet rows with a local decision model."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexandre Alves", email = "alexxalvess@gmail.com" }]
requires-python = ">=3.10"
keywords = ["classification", "spreadsheet", "csv", "local-ai", "laya", "gradio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "defusedxml>=0.7",  # openpyxl uses it to read .xlsx XML safely
    "laya==0.5.6",  # the version the tests and benchmarks ran on; bump it after re-running them
]

[project.urls]
Homepage = "https://github.com/HayateV30/luar"
Documentation = "https://github.com/HayateV30/luar#readme"
Issues = "https://github.com/HayateV30/luar/issues"
Changelog = "https://github.com/HayateV30/luar/releases"

[project.optional-dependencies]
ui = [
    "gradio>=6.0",  # row_limits/column_limits on gr.Dataframe
    "anyio>=4",  # gradio accepts 3.x but cannot build the page with it
]
laya = []  # Laya is now a required dependency; kept so `luar[laya]` still installs cleanly
thx = ["thx01==1.0.0"]  # the optional THX-01 engine; the version the tests and benchmarks ran on
ocr = ["liteparse==2.21.3"]  # reading PDFs and images; the version the tests and benchmarks ran on
all = ["luar[ui,thx,ocr]"]
dev = ["pytest>=8"]

[project.scripts]
luar = "luar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luar = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real Laya model (downloads weights; run with -m slow)"]
addopts = "-m 'not slow'"
